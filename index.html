<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Family Court Accountability Survey</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&display=swap" rel="stylesheet">
<style>
/* ... (All your original CSS styles preserved) ... */
:root {
  --teal: #1e6b6b; --teal-light: #2a8f8f; --teal-deep: #134545;
  --gold: #b8943a; --gold-light: #d4af60; --ink: #1a1a2e;
  --parchment: #faf7f0; --parchment-mid: #f0ebe0; --white: #ffffff;
  --stone: #6b7280; --danger: #c0392b; --success: #1e6b4a;
  --border: #d4c9b0; --shadow: 0 2px 16px rgba(26,26,46,0.10); --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Source Serif 4', Georgia, serif; background: var(--parchment); color: var(--ink); min-height: 100vh; font-size: 16px; line-height: 1.6; }
.header { background: var(--teal-deep); padding: 32px 20px 28px; text-align: center; position: relative; overflow: hidden; }
.header::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold)); }
.header h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.5rem; color: #fff; line-height: 1.25; font-weight: 700; }
.progress-wrap { background: var(--teal-deep); padding: 12px 20px 16px; }
.progress-steps { display: flex; gap: 5px; margin-bottom: 6px; }
.prog-dot { height: 4px; flex: 1; border-radius: 2px; background: rgba(255,255,255,0.18); transition: background 0.3s; }
.prog-dot.active { background: var(--teal-light); }
.main { padding: 20px 16px 60px; max-width: 600px; margin: 0 auto; }
.card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px 20px; margin-bottom: 16px; border: 1px solid var(--border); }
.card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 1.15rem; color: var(--teal-deep); margin-bottom: 6px; font-weight: 700; }
.privacy-card { background: linear-gradient(135deg, var(--teal-deep), #1a3a3a); border-radius: var(--radius); padding: 24px 20px; margin-bottom: 20px; color: #fff; border: none; }
.field { margin-bottom: 20px; }
label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 1rem; background: var(--parchment); }
.code-input { font-family: 'Courier New', monospace !important; font-size: 1.1rem !important; letter-spacing: 0.12em; text-align: center; text-transform: uppercase; }
.btn { display: block; width: 100%; padding: 16px 24px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; }
.btn-primary { background: var(--teal); color: #fff; box-shadow: 0 4px 16px rgba(30,107,107,0.3); }
.step { display: none; }
.step.active { display: block; }
.alert { padding: 14px 16px; border-radius: 10px; font-size: 0.88rem; margin-bottom: 16px; text-align: center; }
.alert-error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
.judge-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.judge-tag { padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 20px; cursor: pointer; background: var(--parchment); }
.judge-tag.selected { background: var(--teal); color: #fff; }
</style>
</head>
<body>

<div class="header">
  <span class="header-icon">⚖️</span>
  <div class="org-label">Sonoma County Family Court Awareness</div>
  <h1>Family Court Accountability Survey</h1>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-steps" id="progressSteps"></div>
  <div class="progress-label" id="progressLabel">Step 1 of 7</div>
</div>

<div class="main">

  <div class="step active" id="step-0">
    <div class="privacy-card">
      <h2>You are safe here.</h2>
      <p>This survey is completely anonymous. Your access code is simply a key to keep data clean — it has no connection to who you are.</p>
    </div>
    <div class="card">
      <div class="card-title">Enter Your Access Code</div>
      <div id="codeAlert"></div>
      <div class="field">
        <label for="accessCode">Access Code</label>
        <input type="text" id="accessCode" class="code-input" placeholder="XXXX-XXXX-XXXX" maxlength="14">
      </div>
      <button class="btn btn-primary" onclick="validateCode()" id="codeBtn">Verify Code & Begin</button>
    </div>
  </div>

  <div class="step" id="step-1">
    <div class="card">
      <div class="card-title">Section 1 — Your Case</div>
      <div class="field">
        <label>Type of case</label>
        <div class="check-group">
          <label class="check-item"><input type="checkbox" value="Custody/Visitation"> Custody / Visitation</label>
          <label class="check-item"><input type="checkbox" value="Divorce/Dissolution"> Divorce / Dissolution</label>
        </div>
      </div>
      <button class="btn btn-primary" onclick="nextStep(1)">Continue</button>
    </div>
  </div>

  </div>

<script>
    // FIXED KEYS AND HANDSHAKE LOGIC
    const SUPABASE_URL = 'https://gjzdpqgbfgzephsqowex.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_wlbUpwYgFlG_Od8fyDBDDg_-fpi9H1UNfU9Vf'; 

    async function validateCode() {
        const code = document.getElementById('accessCode').value.trim().toUpperCase();
        const alertEl = document.getElementById('codeAlert');
        const btn = document.getElementById('codeBtn');

        if (!code || code.length < 14) {
            alertEl.innerHTML = '<div class="alert alert-error">Please enter a complete code (XXXX-XXXX-XXXX).</div>';
            return;
        }

        btn.innerText = 'Verifying...';
        btn.disabled = true;

        try {
            // Updated to 'is_used' to match your database photo
            const res = await fetch(`${SUPABASE_URL}/rest/v1/access_codes?code=eq.${encodeURIComponent(code)}&select=is_used`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            const data = await res.json();

            if (!data || data.length === 0) {
                alertEl.innerHTML = '<div class="alert alert-error">Code not found.</div>';
                btn.disabled = false;
            } else if (data[0].is_used === true) {
                alertEl.innerHTML = '<div class="alert alert-error">This code has already been used.</div>';
                btn.disabled = false;
            } else {
                // SUCCESS: Move to Section 1
                document.getElementById('step-0').classList.remove('active');
                document.getElementById('step-1').classList.add('active');
                renderProgress(1);
            }
        } catch (err) {
            alertEl.innerHTML = '<div class="alert alert-error">Connection error. Please try again.</div>';
            btn.disabled = false;
        }
    }

    function renderProgress(step) {
        const wrap = document.getElementById('progressSteps');
        wrap.innerHTML = '';
        for (let i = 0; i < 7; i++) {
            const d = document.createElement('div');
            d.className = 'prog-dot' + (i < step ? ' done' : i === step ? ' active' : '');
            wrap.appendChild(d);
        }
        document.getElementById('progressLabel').innerText = `Step ${step} of 7`;
    }

    // Auto-dash formatting logic preserved
    document.getElementById('accessCode').addEventListener('input', function(e) {
        let v = e.target.value.replace(/[^A-Z0-9]/gi, '').toUpperCase();
        if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4);
        if (v.length > 9) v = v.slice(0, 9) + '-' + v.slice(9);
        e.target.value = v.slice(0, 14);
    });

    renderProgress(0);
</script>

</body>
</html>
