:root {
  --teal: #1e6b6b;
  --teal-light: #2a8f8f;
  --teal-deep: #134545;
  --gold: #b8943a;
  --gold-light: #d4af60;
  --ink: #1a1a2e;
  --parchment: #faf7f0;
  --parchment-mid: #f0ebe0;
  --white: #ffffff;
  --stone: #6b7280;
  --danger: #c0392b;
  --success: #1e6b4a;
  --border: #d4c9b0;
  --shadow: 0 2px 16px rgba(26,26,46,0.10);
  --radius: 12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Source Serif 4', Georgia, serif;
  background: var(--parchment);
  color: var(--ink);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.6;
}

/* HEADER */
.header {
  background: var(--teal-deep);
  padding: 32px 20px 28px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light), var(--gold));
}
.header-icon { font-size: 2rem; display: block; margin-bottom: 12px; }
.org-label {
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--gold-light);
  margin-bottom: 10px;
  font-weight: 600;
}
.header h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.5rem;
  color: #fff;
  line-height: 1.25;
  font-weight: 700;
}

/* PROGRESS */
.progress-wrap {
  background: var(--teal-deep);
  padding: 12px 20px 16px;
}
.progress-steps {
  display: flex;
  gap: 5px;
  margin-bottom: 6px;
}
.prog-dot {
  height: 4px;
  flex: 1;
  border-radius: 2px;
  background: rgba(255,255,255,0.18);
  transition: background 0.3s;
}
.prog-dot.done { background: var(--gold); }
.prog-dot.active { background: var(--teal-light); }
.progress-label {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.55);
  letter-spacing: 0.06em;
  text-align: center;
}

/* MAIN */
.main { padding: 20px 16px 60px; max-width: 600px; margin: 0 auto; }

/* CARDS */
.card {
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 24px 20px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
}
.card-title {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 1.15rem;
  color: var(--teal-deep);
  margin-bottom: 6px;
  font-weight: 700;
}
.card-subtitle {
  font-size: 0.85rem;
  color: var(--stone);
  margin-bottom: 20px;
  font-style: italic;
  line-height: 1.5;
}

/* PRIVACY STATEMENT */

  background: linear-gradient(135deg, var(--teal-deep), #1a3a3a);
  border-radius: var(--radius);

  margin-bottom: 20px;
  color: #fff;
  border: none;
}

  font-size: 1.25rem;
  margin-bottom: 14px;
  color: var(--gold-light);
}
